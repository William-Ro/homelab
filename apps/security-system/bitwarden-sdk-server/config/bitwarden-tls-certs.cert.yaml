---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
spec:
  secretName: bitwarden-tls-certs
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames:
    - bitwarden-sdk-server
    - bitwarden-sdk-server.security-system
    - bitwarden-sdk-server.security-system.svc
    - bitwarden-sdk-server.security-system.svc.cluster.local
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
