---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-alerts
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: blackbox-exporter
    app.kubernetes.io/managed-by: flux
spec:
  groups:
    - name: blackbox.availability
      rules:
        - alert: BlackboxProbeFailed
          expr: probe_success == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.target }} is unreachable
            description: >-
              The HTTP probe against {{ $labels.target }} has been failing for more than 5 minutes.

        - alert: BlackboxProbeSlowResponse
          expr: probe_http_duration_seconds{phase="processing"} > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.target }} is responding slowly
            description: >-
              HTTP response time for {{ $labels.target }} exceeds 2 seconds.

        - alert: BlackboxScrapeFailed
          expr: up{job="blackbox"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: >-
              Blackbox scrape for {{ $labels.instance }} is failing
            description: >-
              Alloy cannot scrape the blackbox-exporter for this target.

        - alert: BlackboxMetricsMissing
          expr: absent_over_time(up{job="blackbox"}[5m])
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Blackbox scrape metrics are missing
            description: >-
              No blackbox scrape status has reached Mimir for at least 5 minutes.
