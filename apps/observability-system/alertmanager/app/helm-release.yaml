---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager
  namespace: observability-system
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: alertmanager
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: alertmanager-chart
    namespace: observability-system

  values:
    fullnameOverride: alertmanager
    replicaCount: 1

    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: default
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: "null"
            matchers:
              - alertname=~"Watchdog|InfoInhibitor"
      inhibit_rules:
        - source_matchers:
            - severity="critical"
          target_matchers:
            - severity="warning"
          equal: [alertname, namespace]
      receivers:
        - name: "null"
        - name: default
          discord_configs:
            - webhook_url_file: /etc/alertmanager/secrets/webhookUrl
              send_resolved: true

    extraVolumes:
      - name: alertmanager-credentials
        secret:
          secretName: alertmanager-credentials

    extraVolumeMounts:
      - name: alertmanager-credentials
        mountPath: /etc/alertmanager/secrets
        readOnly: true

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
