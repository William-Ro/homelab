---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-alerts
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: alertmanager
    app.kubernetes.io/managed-by: flux
spec:
  groups:
    - name: kubernetes.nodes
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node {{ $labels.node }} is not ready

    - name: kubernetes.pods
      rules:
        - alert: KubernetesPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping

        - alert: KubernetesPodNotReady
          expr: >-
            kube_pod_status_ready{condition="false"} == 1
            AND on(pod, namespace)
            kube_pod_status_phase{phase="Running"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready

        - alert: KubernetesPVCPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is stuck in Pending

    - name: flux.reconciliation
      rules:
        - alert: FluxReconciliationFailed
          expr: gotk_reconcile_condition{type="Ready",status="False"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Flux {{ $labels.kind }}/{{ $labels.name }} reconciliation failed in {{ $labels.namespace }}

    - name: storage.garage
      rules:
        - alert: GarageDataPVCLowDiskSpace
          expr: >-
            kubelet_volume_stats_available_bytes{
              persistentvolumeclaim=~"data-garage-.*"
            } < 5368709120
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Garage data PVC {{ $labels.persistentvolumeclaim }} has less than 5Gi free
            description: >-
              Available: {{ $value | humanize1024 }}B. With 3x replication, effective usable
              space is ~6.7Gi total. Reduce Mimir retention or increase PVC size.

        - alert: GarageDataPVCCritical
          expr: >-
            kubelet_volume_stats_available_bytes{
              persistentvolumeclaim=~"data-garage-.*"
            } < 2147483648
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Garage data PVC {{ $labels.persistentvolumeclaim }} has less than 2Gi free — imminent failure
            description: >-
              Available: {{ $value | humanize1024 }}B. Mimir writes will start failing immediately.
              Restart mimir-compactor and check retention settings.

    - name: observability.mimir.compactor
      rules:
        - alert: MimirCompactorNotRunning
          expr: >-
            (time() - cortex_compactor_last_successful_run_timestamp_seconds) > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Mimir compactor has not completed a run in over 2 hours
            description: >-
              Last successful run was {{ $value | humanizeDuration }} ago.
              Blocks will accumulate and Garage storage will fill up.
              Check: kubectl -n observability-system logs -l app.kubernetes.io/component=compactor

    - name: storage.kafka
      rules:
        - alert: KafkaPVCLowDiskSpace
          expr: >-
            kubelet_volume_stats_available_bytes{
              persistentvolumeclaim=~"kafka-data-.*"
            } < 3221225472
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Kafka PVC {{ $labels.persistentvolumeclaim }} has less than 3Gi free
            description: >-
              Available: {{ $value | humanize1024 }}B. Kafka will crash when full — increase PVC size or reduce retention.

    - name: observability.mimir
      rules:
        - alert: MimirIngestionRateLimited
          expr: >-
            sum(rate(cortex_discarded_samples_total{reason="ingestion-rate-limited"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Mimir is dropping samples due to ingestion rate limiting
            description: >-
              Samples are being rejected with HTTP 429. Increase ingestion_rate/ingestion_burst_size or reduce scrape volume.

    - name: storage.longhorn
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Longhorn volume {{ $labels.volume }} is degraded
            description: >-
              Volume {{ $labels.volume }} has lost replicas. Check node/disk health.

        - alert: LonghornDiskPressure
          expr: >-
            (longhorn_disk_capacity_bytes - longhorn_disk_usage_bytes)
            / longhorn_disk_capacity_bytes < 0.10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Longhorn disk on {{ $labels.node }} ({{ $labels.disk }}) is over 90% full
