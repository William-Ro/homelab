---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-alerts
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: alertmanager
    app.kubernetes.io/managed-by: flux
spec:
  groups:
    - name: kubernetes.nodes
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Node {{ $labels.node }} is not ready

    - name: kubernetes.pods
      rules:
        - alert: KubernetesPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping

        - alert: KubernetesPodNotReady
          expr: >-
            kube_pod_status_ready{condition="false"} == 1
            AND on(pod, namespace)
            kube_pod_status_phase{phase="Running"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready

        - alert: KubernetesPVCPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is stuck in Pending

    - name: flux.reconciliation
      rules:
        - alert: FluxReconciliationFailed
          expr: gotk_reconcile_condition{type="Ready",status="False"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Flux {{ $labels.kind }}/{{ $labels.name }} reconciliation failed in {{ $labels.namespace }}

    - name: observability.mimir.compactor
      rules:
        - alert: MimirCompactorNotRunning
          expr: >-
            (time() - cortex_compactor_last_successful_run_timestamp_seconds) > 7200
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Mimir compactor has not completed a run in over 2 hours
            description: >-
              Last successful run was {{ $value | humanizeDuration }} ago.
              Blocks will accumulate and Garage storage will fill up.
              Check: kubectl -n observability-system logs -l app.kubernetes.io/component=compactor

    - name: storage.kafka
      rules:
        - alert: KafkaPVCLowDiskSpace
          expr: >-
            kubelet_volume_stats_available_bytes{
              persistentvolumeclaim=~"kafka-data-.*"
            } < 3221225472
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Kafka PVC {{ $labels.persistentvolumeclaim }} has less than 3Gi free
            description: >-
              Available: {{ $value | humanize1024 }}B. Kafka will crash when full — increase PVC size or reduce retention.

    - name: observability.mimir
      rules:
        - alert: MimirIngestionRateLimited
          expr: >-
            sum(rate(cortex_discarded_samples_total{reason="ingestion-rate-limited"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Mimir is dropping samples due to ingestion rate limiting
            description: >-
              Samples are being rejected with HTTP 429. Increase ingestion_rate/ingestion_burst_size or reduce scrape volume.

    - name: storage.pvc
      rules:
        - alert: PVCHighUsage
          expr: >-
            kubelet_volume_stats_used_bytes
            / kubelet_volume_stats_capacity_bytes > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full
            description: >-
              Usage: {{ $value | humanizePercentage }}. Free up space, expand the PVC,
              or reduce retention for the affected workload.

        - alert: PVCCriticalUsage
          expr: >-
            kubelet_volume_stats_used_bytes
            / kubelet_volume_stats_capacity_bytes > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 95% full — writes will fail soon
            description: >-
              Usage: {{ $value | humanizePercentage }}. Immediate action required.

    - name: networking.certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: >-
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days
            description: >-
              Cert-manager should auto-renew but may be blocked by Cloudflare API issues.
              Check: kubectl -n network-system get certificate {{ $labels.name }}

        - alert: CertificateExpiryCritical
          expr: >-
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 3 * 24 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 3 days
            description: >-
              HTTPS will break imminently. Cert-manager renewal is failing.
              Check cert-manager logs: kubectl -n network-system logs -l app=cert-manager

    - name: security.externalsecrets
      rules:
        - alert: ExternalSecretSyncFailed
          expr: >-
            increase(externalsecrets_sync_calls_total{status="error"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} failed to sync from Bitwarden
            description: >-
              Secret sync is failing. New or rotated secrets will not be applied to the cluster.
              Check bitwarden-sdk-server: kubectl -n security-system logs -l app=bitwarden-sdk-server

    - name: hardware.gpu
      rules:
        - alert: IntelGPUUnavailable
          expr: >-
            kube_node_status_allocatable{resource="gpu_intel_com_i915"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Intel GPU (i915) is not allocatable on node {{ $labels.node }}
            description: >-
              Jellyfin will fall back to CPU transcoding, causing high CPU load.
              Check intel-gpu-device-plugin: kubectl -n kube-system get pods -l app=intel-gpu-device-plugin
