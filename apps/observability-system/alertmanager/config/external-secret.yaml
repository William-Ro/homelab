---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: alertmanager
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      data:
        # Full alertmanager.yaml rendered with webhook URL from Bitwarden
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m

          route:
            receiver: default
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: "null"
                matchers:
                  - alertname=~"Watchdog|InfoInhibitor"

          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal: [alertname, namespace]

          receivers:
            - name: "null"
            - name: default
              webhook_configs:
                - url: "{{ .webhookUrl }}"
                  send_resolved: true

  data:
    - secretKey: webhookUrl
      remoteRef:
        key: Alertmanager Webhook URL
