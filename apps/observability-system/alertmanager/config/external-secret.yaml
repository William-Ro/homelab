---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-credentials
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: alertmanager
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: alertmanager-credentials
    creationPolicy: Owner
    template:
      data:
        # Rendered as Flux HelmRelease valuesFrom values.yaml —
        # merges receivers into the config: block defined in the HelmRelease
        values.yaml: |
          config:
            receivers:
              - name: "null"
              - name: default
                webhook_configs:
                  - url: "{{ .webhookUrl }}"
                    send_resolved: true

  data:
    - secretKey: webhookUrl
      remoteRef:
        key: Alertmanager Webhook URL
