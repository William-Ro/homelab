---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: observability-system
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: mimir
    namespace: observability-system

  values:
    minio:
      enabled: false

    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-s3-credentials
      # Applies reloader annotation to all pods so they restart on secret rotation
      podAnnotations:
        reloader.stakater.com/auto: "true"

    mimir:
      structuredConfig:
        multitenancy_enabled: false

        # Disable Kafka-based ingest storage; use classic distributor→ingester path
        ingest_storage:
          enabled: false

        limits:
          max_global_series_per_user: 300000
          compactor_blocks_retention_period: 14d
          ingestion_rate: 50000
          ingestion_burst_size: 100000
          out_of_order_time_window: 6h

        common:
          storage:
            backend: s3
            s3:
              endpoint: truenas.reli.cc:30188
              region: us-east-1
              insecure: true
              access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
              secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}

        ruler:
          alertmanager_url: http://alertmanager.observability-system.svc.cluster.local:9093
          enable_api: true

        blocks_storage:
          s3:
            bucket_name: mimir
          storage_prefix: blocks
          tsdb:
            dir: /data/tsdb
            head_compaction_interval: 15m
            wal_replay_concurrency: 3

        alertmanager_storage:
          s3:
            bucket_name: mimir
          storage_prefix: alertmanager

        ruler_storage:
          s3:
            bucket_name: mimir
          storage_prefix: ruler

    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      readinessProbe:
        initialDelaySeconds: 60
        failureThreshold: 10
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      persistentVolume:
        storageClass: truenas-iscsi
        size: 15Gi

    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistentVolume:
        storageClass: truenas-iscsi
        size: 5Gi

    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistentVolume:
        storageClass: truenas-iscsi
        size: 20Gi

    alertmanager:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      persistentVolume:
        storageClass: truenas-iscsi
        size: 1Gi
      fallbackConfig: ""

    kafka:
      enabled: false

    distributor:
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    querier:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    query_frontend:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    query_scheduler:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi

    ruler:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    gateway:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    overrides_exporter:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

    rollout_operator:
      enabled: false

    "chunks-cache":
      enabled: false
    "index-cache":
      enabled: false
    "metadata-cache":
      enabled: false
    "results-cache":
      enabled: false
