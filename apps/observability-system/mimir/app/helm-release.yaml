---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: observability-system
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: mimir
    namespace: observability-system

  values:
    # Disable built-in minio — we use Garage
    minio:
      enabled: false

    # Inject S3 credentials from ExternalSecret into all pods
    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-s3-credentials

    mimir:
      structuredConfig:
        multitenancy_enabled: false

        limits:
          # Default is 150000 — increase for homelab with many scraped series
          max_global_series_per_user: 500000
          # Retain metrics for 90 days; compactor will delete blocks older than this
          compactor_blocks_retention_period: 90d
          # Raised from 50k — 3 Alloy instances need more headroom; burst handles WAL replays
          ingestion_rate: 100000
          ingestion_burst_size: 400000
          # Accept out-of-order samples up to 6h — prevents data loss during WAL replay after outages
          out_of_order_time_window: 6h

        # Hard per-ingester ceilings — reject new series/traffic rather than OOMing.
        # With 2 ingesters and max_global_series_per_user=500k, each holds ~250k series.
        # Set ceiling at 400k (~60% headroom) so cardinality spikes get rejected gracefully.
        ingester:
          instance_limits:
            max_series: 400000
            max_ingestion_rate: 150000

        # Distributor-level protections:
        # - remote_timeout: increase from 2s default — ingesters can be temporarily
        #   slow during WAL replay or head compaction on a small homelab cluster.
        # - instance_limits: reject at the distributor before traffic reaches ingesters.
        distributor:
          remote_timeout: 5s
          instance_limits:
            max_ingestion_rate: 200000

        common:
          storage:
            backend: s3
            s3:
              endpoint: garage.storage-system.svc.cluster.local:3900
              region: garage
              insecure: true
              access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
              secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}

        ruler:
          alertmanager_url: http://alertmanager.observability-system.svc.cluster.local:9093
          enable_api: true

        blocks_storage:
          s3:
            bucket_name: mimir
          storage_prefix: blocks
          tsdb:
            dir: /data/tsdb
            head_compaction_interval: 15m
            wal_replay_concurrency: 3

        alertmanager_storage:
          s3:
            bucket_name: mimir
          storage_prefix: alertmanager

        ruler_storage:
          s3:
            bucket_name: mimir
          storage_prefix: ruler

    # Single-zone homelab: disable zone-aware replication
    ingester:
      replicas: 2
      zoneAwareReplication:
        enabled: false
      readinessProbe:
        initialDelaySeconds: 60
        failureThreshold: 10
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 3Gi
      persistentVolume:
        storageClass: longhorn
        size: 5Gi
      extraInitContainers:
        - name: wait-for-kafka
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z mimir-kafka.observability-system.svc.cluster.local 9092; do
                echo "waiting for kafka..."; sleep 2
              done

    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistentVolume:
        storageClass: longhorn
        size: 5Gi

    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistentVolume:
        storageClass: longhorn
        size: 5Gi

    alertmanager:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      persistentVolume:
        storageClass: longhorn
        size: 1Gi
      fallbackConfig: ""

    kafka:
      persistence:
        storageClassName: longhorn
        size: 20Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Give Kafka time to flush cleanly on shutdown (e.g. node drain, pod eviction)
      terminationGracePeriodSeconds: 120
      extraEnv:
        - name: KAFKA_LOG_RETENTION_MS
          value: "3600000"
        - name: KAFKA_LOG_RETENTION_BYTES
          value: "1073741824"
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: "134217728"
        - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
          value: "60000"
        # Flush to disk every 5s or 10k messages to reduce checkpoint corruption risk
        # on unclean shutdowns (e.g. power outages). Default is OS-buffered (never).
        - name: KAFKA_LOG_FLUSH_INTERVAL_MS
          value: "5000"
        - name: KAFKA_LOG_FLUSH_INTERVAL_MESSAGES
          value: "10000"
        # Speed up log recovery after an unclean shutdown
        - name: KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR
          value: "2"

    distributor:
      extraInitContainers:
        - name: wait-for-kafka
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z mimir-kafka.observability-system.svc.cluster.local 9092; do
                echo "waiting for kafka..."; sleep 2
              done
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 1Gi

    querier:
      extraInitContainers:
        - name: wait-for-kafka
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z mimir-kafka.observability-system.svc.cluster.local 9092; do
                echo "waiting for kafka..."; sleep 2
              done
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    query_frontend:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    query_scheduler:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi

    ruler:
      extraInitContainers:
        - name: wait-for-kafka
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z mimir-kafka.observability-system.svc.cluster.local 9092; do
                echo "waiting for kafka..."; sleep 2
              done
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    gateway:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    overrides_exporter:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

    rollout_operator:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Disable optional components not needed for basic homelab setup
    "chunks-cache":
      enabled: false
    "index-cache":
      enabled: false
    "metadata-cache":
      enabled: false
    "results-cache":
      enabled: false
