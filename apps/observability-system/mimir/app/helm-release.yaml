---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: observability-system
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: mimir
    namespace: observability-system

  values:
    # Disable built-in minio — we use Garage
    minio:
      enabled: false

    # Inject S3 credentials from ExternalSecret into all pods
    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-s3-credentials

    mimir:
      structuredConfig:
        multitenancy_enabled: false

        limits:
          # Default is 150000 — increase for homelab with many scraped series
          max_global_series_per_user: 500000
          # Retain metrics for 90 days; compactor will delete blocks older than this
          compactor_blocks_retention_period: 90d

        common:
          storage:
            backend: s3
            s3:
              endpoint: garage.storage-system.svc.cluster.local:3900
              region: garage
              insecure: true
              access_key_id: ${MIMIR_S3_ACCESS_KEY_ID}
              secret_access_key: ${MIMIR_S3_SECRET_ACCESS_KEY}

        ruler:
          alertmanager_url: http://alertmanager.observability-system.svc.cluster.local:9093
          enable_api: true

        blocks_storage:
          s3:
            bucket_name: mimir
          storage_prefix: blocks
          tsdb:
            dir: /data/tsdb
            head_compaction_interval: 15m
            wal_replay_concurrency: 3
            ship_interval: 1m  # ship completed blocks to S3 quickly so local disk stays small

        alertmanager_storage:
          s3:
            bucket_name: mimir
          storage_prefix: alertmanager

        ruler_storage:
          s3:
            bucket_name: mimir
          storage_prefix: ruler

    # Single-zone homelab: disable zone-aware replication
    ingester:
      replicas: 2
      zoneAwareReplication:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1500Mi
      persistentVolume:
        storageClass: longhorn
        size: 5Gi
      extraInitContainers:
        - name: wait-for-kafka
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z mimir-kafka.observability-system.svc.cluster.local 9092; do
                echo "waiting for kafka..."; sleep 2
              done

    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistentVolume:
        storageClass: longhorn
        size: 5Gi

    compactor:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistentVolume:
        storageClass: longhorn
        size: 5Gi

    alertmanager:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      persistentVolume:
        storageClass: longhorn
        size: 1Gi
      fallbackConfig: ""

    kafka:
      persistentVolume:
        storageClass: longhorn
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraConfig: |
        log.retention.hours=2
        log.retention.check.interval.ms=300000
        log.segment.bytes=268435456

    distributor:
      resources:
        requests:
          cpu: 30m
          memory: 128Mi
        limits:
          memory: 256Mi

    querier:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    query_frontend:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    query_scheduler:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi

    ruler:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    gateway:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    overrides_exporter:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

    rollout_operator:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Disable optional components not needed for basic homelab setup
    "chunks-cache":
      enabled: false
    "index-cache":
      enabled: false
    "metadata-cache":
      enabled: false
    "results-cache":
      enabled: false
