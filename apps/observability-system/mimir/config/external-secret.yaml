---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-s3-credentials
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: mimir-s3-credentials
    creationPolicy: Owner

  data:
    - secretKey: MIMIR_S3_ACCESS_KEY_ID
      remoteRef:
        key: Garage Mimir Key ID
    - secretKey: MIMIR_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: Garage Mimir Secret Key
