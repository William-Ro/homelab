---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json

apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: grafana
    app.kubernetes.io/managed-by: flux
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana

  datasource:
    type: prometheus
    name: Mimir
    access: proxy
    isDefault: true
    url: http://mimir-gateway.observability-system.svc.cluster.local:80/prometheus
    jsonData:
      httpMethod: POST
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "anonymous"
