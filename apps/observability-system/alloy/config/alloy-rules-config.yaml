---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-rules-config
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: rules
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/managed-by: flux
data:
  config.alloy: |
    // Syncs PrometheusRule CRDs from the cluster to Mimir's ruler API
    mimir.rules.kubernetes "default" {
      address = "http://mimir-gateway.observability-system.svc.cluster.local:80"
    }
