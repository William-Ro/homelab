---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics-config
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/managed-by: flux
data:
  config.alloy: |

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-gateway.observability-system.svc.cluster.local:80/api/v1/push"

        queue_config {
          max_shards         = 4
          max_samples_per_send = 2000
          batch_send_deadline  = "5s"
        }
      }
      external_labels = {
        cluster = "homelab",
      }
    }


    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:10250"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "30s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:10250"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      job_name          = "cadvisor"
      scheme            = "https"
      scrape_interval   = "30s"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }


    discovery.kubernetes "kube_state_metrics" {
      role = "service"
      selectors {
        role  = "service"
        label = "app.kubernetes.io/name=kube-state-metrics"
      }
    }

    prometheus.scrape "kube_state_metrics" {
      targets         = discovery.kubernetes.kube_state_metrics.targets
      job_name        = "kube-state-metrics"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.exporter.unix "node" {
      procfs_path = "/host/proc"
      sysfs_path  = "/host/sys"
      udev_data_path = "/run/udev/data"
    }

    prometheus.scrape "node" {
      targets         = prometheus.exporter.unix.node.targets
      job_name        = "node-exporter"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "annotated_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        target_label  = "__metrics_path__"
        action        = "replace"
        regex         = "(.+)"
      }

      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        action        = "replace"
        regex         = "([^:]+)(?:\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    prometheus.scrape "annotated_pods" {
      targets         = discovery.relabel.annotated_pods.output
      job_name        = "kubernetes-pods"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }


    discovery.kubernetes "mimir_pods" {
      role = "pod"
      namespaces {
        names = ["observability-system"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=mimir"
      }
    }

    discovery.relabel "mimir_pods" {
      targets = discovery.kubernetes.mimir_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        separator     = "/"
        target_label  = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "mimir_pods" {
      targets         = discovery.relabel.mimir_pods.output
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }


    discovery.relabel "blackbox_http" {
      targets = [
        {"__address__" = "https://grafana.internal.reli.cc",               "__tmp_name" = "grafana"},
        {"__address__" = "https://alertmanager.admin.reli.cc",             "__tmp_name" = "alertmanager"},
        {"__address__" = "https://pihole.admin.reli.cc/admin",             "__tmp_name" = "pihole"},
        {"__address__" = "https://flux.admin.reli.cc",                     "__tmp_name" = "flux"},
        {"__address__" = "https://mimir.admin.reli.cc",                    "__tmp_name" = "mimir"},
        {"__address__" = "https://alloy.admin.reli.cc",                    "__tmp_name" = "alloy"},
        {"__address__" = "https://blackbox-exporter.admin.reli.cc",        "__tmp_name" = "blackbox-exporter"},
        {"__address__" = "https://prowlarr.internal.reli.cc",              "__tmp_name" = "prowlarr"},
        {"__address__" = "https://sonarr.internal.reli.cc",                "__tmp_name" = "sonarr"},
        {"__address__" = "https://radarr.internal.reli.cc",                "__tmp_name" = "radarr"},
        {"__address__" = "https://qbittorrent.internal.reli.cc",           "__tmp_name" = "qbittorrent"},
        {"__address__" = "https://bazarr.internal.reli.cc",                "__tmp_name" = "bazarr"},
        {"__address__" = "https://jellyfin.internal.reli.cc",              "__tmp_name" = "jellyfin"},
      ]

      rule {
        source_labels = ["__address__"]
        target_label  = "__param_target"
      }

      rule {
        replacement  = "http_2xx"
        target_label = "__param_module"
      }

      rule {
        replacement  = "blackbox-exporter.observability-system.svc.cluster.local:9115"
        target_label = "__address__"
      }

      rule {
        source_labels = ["__param_target"]
        target_label  = "target_url"
      }

      rule {
        source_labels = ["__tmp_name"]
        target_label  = "instance"
      }

      rule {
        source_labels = ["__tmp_name"]
        target_label  = "target"
      }

      rule {
        source_labels = ["__tmp_name"]
        target_label  = "service"
      }
    }

    prometheus.scrape "blackbox_http" {
      targets         = discovery.relabel.blackbox_http.output
      job_name        = "blackbox"
      scrape_interval = "30s"
      metrics_path    = "/probe"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }


    discovery.kubernetes "flux_controllers" {
      role = "pod"
      namespaces {
        names = ["flux-system"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/part-of=flux"
      }
    }

    discovery.relabel "flux_controllers" {
      targets = discovery.kubernetes.flux_controllers.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "component"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    prometheus.scrape "flux_controllers" {
      targets         = discovery.relabel.flux_controllers.output
      job_name        = "flux-system"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }


    mimir.rules.kubernetes "default" {
      address = "http://mimir-gateway.observability-system.svc.cluster.local:80"
    }
