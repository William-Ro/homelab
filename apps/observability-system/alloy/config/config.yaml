---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics-config
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/managed-by: flux
data:
  config.alloy: |

    // ── REMOTE WRITE ──────────────────────────────────────────────────────────
    // All scraped metrics go to Mimir. The cluster label is attached globally.

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-gateway.observability-system.svc.cluster.local:80/api/v1/push"

        queue_config {
          max_shards         = 4
          max_samples_per_send = 2000
          batch_send_deadline  = "5s"
        }
      }
      external_labels = {
        cluster = "homelab",
      }
    }


    // ── KUBERNETES INFRASTRUCTURE ─────────────────────────────────────────────
    // Node-level metrics: kubelet (node stats), cadvisor (container resources),
    // kube-state-metrics (object state), node-exporter (OS stats), kube-apiserver.

    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        action        = "keep"
        regex         = env("K8S_NODE_NAME")
      }

      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        target_label  = "__address__"
        replacement   = "$1:10250"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "30s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // cadvisor reuses the kubelet node targets; relabel overrides job and
    // adds metrics_path so dashboards can distinguish cadvisor series.
    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "cadvisor"
      scheme            = "https"
      scrape_interval   = "30s"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    prometheus.relabel "cadvisor" {
      rule {
        target_label = "job"
        replacement  = "kubelet"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics/cadvisor"
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    discovery.kubernetes "kube_state_metrics" {
      role = "service"
      selectors {
        role  = "service"
        label = "app.kubernetes.io/name=kube-state-metrics"
      }
    }

    prometheus.scrape "kube_state_metrics" {
      targets         = discovery.kubernetes.kube_state_metrics.targets
      job_name        = "kube-state-metrics"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    // Built-in node exporter; job is overridden to "integrations/node_exporter"
    // so the Node Exporter Full dashboard (grafana.com/1860) variables resolve.
    prometheus.exporter.unix "node" {
      procfs_path    = "/host/proc"
      sysfs_path     = "/host/sys"
      udev_data_path = "/run/udev/data"
    }

    discovery.relabel "node_exporter" {
      targets = prometheus.exporter.unix.node.targets
      rule {
        target_label = "job"
        replacement  = "integrations/node_exporter"
      }
    }

    prometheus.scrape "node" {
      targets         = discovery.relabel.node_exporter.output
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    discovery.kubernetes "kube_apiserver" {
      role = "endpoints"
      namespaces {
        names = ["default"]
      }
    }

    discovery.relabel "kube_apiserver" {
      targets = discovery.kubernetes.kube_apiserver.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_service_name"]
        action        = "keep"
        regex         = "default;kubernetes"
      }
    }

    prometheus.scrape "kube_apiserver" {
      targets           = discovery.relabel.kube_apiserver.output
      job_name          = "kubernetes"
      scheme            = "https"
      scrape_interval   = "30s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.mimir.receiver]
    }


    // ── APPLICATION METRICS ───────────────────────────────────────────────────
    // Pod-level scrapes: a generic annotation-based fallback plus dedicated
    // blocks for apps that need specific targeting or label overrides.

    // Generic fallback: scrapes any pod with prometheus.io/scrape=true.
    // Pods with app.kubernetes.io/part-of=flux are dropped here since they
    // have a dedicated block below.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "annotated_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        action        = "keep"
        regex         = "true"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
        action        = "drop"
        regex         = "flux"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        target_label  = "__metrics_path__"
        action        = "replace"
        regex         = "(.+)"
      }

      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        action        = "replace"
        regex         = "([^:]+)(?:\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "annotated_pods" {
      targets         = discovery.relabel.annotated_pods.output
      job_name        = "kubernetes-pods"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    // Mimir distributed components — job = "observability-system/<component>".
    discovery.kubernetes "mimir_pods" {
      role = "pod"
      namespaces {
        names = ["observability-system"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=mimir"
      }
    }

    discovery.relabel "mimir_pods" {
      targets = discovery.kubernetes.mimir_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        separator     = "/"
        target_label  = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "mimir_pods" {
      targets         = discovery.relabel.mimir_pods.output
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    // Flux controllers (helm, kustomize, notification, source).
    discovery.kubernetes "flux_controllers" {
      role = "pod"
      namespaces {
        names = ["flux-system"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/part-of=flux"
      }
    }

    discovery.relabel "flux_controllers" {
      targets = discovery.kubernetes.flux_controllers.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        action        = "keep"
        regex         = "8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "flux_controllers" {
      targets         = discovery.relabel.flux_controllers.output
      job_name        = "flux-system"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    // CloudNativePG operator (controller metrics) + postgres instances (cnpg_collector).
    discovery.kubernetes "cnpg_operator" {
      role = "pod"
      namespaces {
        names = ["database-system"]
      }
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=cloudnative-pg"
      }
    }

    discovery.relabel "cnpg_operator" {
      targets = discovery.kubernetes.cnpg_operator.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:8080"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "cnpg_operator" {
      targets         = discovery.relabel.cnpg_operator.output
      job_name        = "cnpg-operator"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }

    discovery.kubernetes "cnpg_pods" {
      role = "pod"
      selectors {
        role  = "pod"
        label = "cnpg.io/podRole=instance"
      }
    }

    discovery.relabel "cnpg_pods" {
      targets = discovery.kubernetes.cnpg_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_ip"]
        target_label  = "__address__"
        replacement   = "$1:9187"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
        target_label  = "cluster"
      }
    }

    prometheus.scrape "cnpg_pods" {
      targets         = discovery.relabel.cnpg_pods.output
      job_name        = "cnpg"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }


    // ── SYNTHETIC PROBES ──────────────────────────────────────────────────────
    // HTTP probes via blackbox-exporter (job = "blackbox").
    // Add new endpoints to the targets list; the module is fixed to http_2xx.

    discovery.relabel "blackbox_http" {
      targets = [
        {"__address__" = "https://grafana.internal.reli.cc"},
        {"__address__" = "https://alertmanager.admin.reli.cc"},
        {"__address__" = "https://pihole.admin.reli.cc/admin"},
        {"__address__" = "https://flux.admin.reli.cc"},
        {"__address__" = "https://mimir.admin.reli.cc"},
        {"__address__" = "https://alloy.admin.reli.cc"},
        {"__address__" = "https://blackbox-exporter.admin.reli.cc"},
        {"__address__" = "https://prowlarr.internal.reli.cc"},
        {"__address__" = "https://sonarr.internal.reli.cc"},
        {"__address__" = "https://radarr.internal.reli.cc"},
        {"__address__" = "https://qbittorrent.internal.reli.cc"},
        {"__address__" = "https://bazarr.internal.reli.cc"},
        {"__address__" = "https://jellyfin.internal.reli.cc"},
        {"__address__" = "https://autobrr.internal.reli.cc"},
        {"__address__" = "https://seerr.internal.reli.cc"},
        {"__address__" = "https://immich.internal.reli.cc"},
      ]

      rule {
        source_labels = ["__address__"]
        target_label  = "__param_target"
      }

      rule {
        replacement  = "http_2xx"
        target_label = "__param_module"
      }

      rule {
        replacement  = "blackbox-exporter.observability-system.svc.cluster.local:9115"
        target_label = "__address__"
      }

      rule {
        source_labels = ["__param_target"]
        target_label  = "target"
      }
    }

    prometheus.scrape "blackbox_http" {
      targets         = discovery.relabel.blackbox_http.output
      job_name        = "blackbox"
      scrape_interval = "30s"
      metrics_path    = "/probe"
      forward_to      = [prometheus.remote_write.mimir.receiver]
    }
