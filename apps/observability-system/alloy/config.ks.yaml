---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy-config
  namespace: observability-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: observability-system

  path: ./apps/observability-system/alloy/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: alloy
    - name: mimir
    - name: kube-state-metrics
