---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-config
  namespace: storage-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: storage-system

  path: ./apps/storage-system/garage/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: bitwarden-sdk-server-config
      namespace: security-system
