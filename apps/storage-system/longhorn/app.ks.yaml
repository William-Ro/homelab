---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: storage-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: storage-system

  path: ./apps/storage-system/longhorn/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: metallb-config
      namespace: network-system  # LoadBalancer IP pool must exist before Longhorn management UI is exposed
