---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: minio-credentials
    creationPolicy: Owner

  data:
    - secretKey: root-user
      remoteRef:
        key: MinIO Root User
    - secretKey: root-password
      remoteRef:
        key: MinIO Root Password
