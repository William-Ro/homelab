---
# Static NFS PV backed by TrueNAS media/downloads dataset
# Multiple pods (qbittorrent, radarr, sonarr, jellyfin) share this via ReadWriteMany
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data
spec:
  capacity:
    storage: 400Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.42
    path: /mnt/media/downloads
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: media-data
  resources:
    requests:
      storage: 400Gi
