---
# Unified PVC for all media data (downloads + library on same filesystem for hardlinks)
# Structure: /data/downloads/ (qbittorrent), /data/media/TV/, /data/media/Movies/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 700Gi
