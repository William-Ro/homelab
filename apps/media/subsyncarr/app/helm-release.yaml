---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subsyncarr
  namespace: media
  labels:
    app.kubernetes.io/name: subsyncarr
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/managed-by: flux
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: subsyncarr

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false

    controllers:
      subsyncarr:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/mrorbitman/subsyncarr
              tag: "1.4.0"
            env:
              PUID: "568"
              PGID: "568"
              TZ: Etc/UTC
              CRON_SCHEDULE: "0 0 * * *"
              SCAN_PATHS: /data
              EXCLUDE_PATHS: /data/audio,/data/complete,/data/incomplete,/data/software,/data/soulseek
              MAX_CONCURRENT_SYNC_TASKS: "1"
              INCLUDE_ENGINES: ffsubsync,autosubsync,alass
              # defaults to 127.0.0.1, must bind all interfaces for the Service to reach it
              WEB_HOST: 0.0.0.0
              WEB_PORT: &port 3000
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                # entrypoint starts as root and uses gosu to chown mounts then drop to PUID/PGID
                add: ["CHOWN", "SETUID", "SETGID"]

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /app/data
      media:
        type: nfs
        server: truenas.reli.cc
        path: /mnt/media/downloads
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
