---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oci-repository.yaml
  - helm-release.yaml
configMapGenerator:
  - name: beets-configmap
    files:
      - config.yaml=./config.yaml
generatorOptions:
  disableNameSuffixHash: true
