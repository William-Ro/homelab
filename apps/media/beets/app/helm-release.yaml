---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beets
  namespace: media
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/managed-by: flux
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: beets

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      beets:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/beets
              tag: "2.13.1"
            command:
              - beet
            args:
              - import
              - -A
              - -q
              - /music
            env:
              BEETSDIR: /config
              TMPDIR: /tmp
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: beets-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
      music:
        type: nfs
        server: truenas.reli.cc
        path: /mnt/media/downloads/audio
        globalMounts:
          - path: /music
      tmp:
        type: emptyDir
