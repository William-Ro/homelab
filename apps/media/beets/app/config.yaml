---
directory: /music
library: /config/library.db

import:
  copy: no
  move: no
  link: no
  hardlink: no
  autotag: yes
  quiet: yes
  quiet_fallback: skip
  resume: no
  # rescan everything nightly so re-downloaded/upgraded albums (same path) get re-tagged
  incremental: no
  # replace the stale library entry instead of silently skipping the re-import
  duplicate_action: remove
  timid: no
  write: yes

plugins: musicbrainz fetchart embedart

match:
  preferred:
    media:
      - Digital Media
      - CD
    original_year: yes

art_filename: cover

fetchart:
  auto: yes
  minwidth: 1000
  maxwidth: 2000
  enforce_ratio: yes
  cover_names: cover front art album folder
  # coverart is keyed to the matched MusicBrainz release, so it's the most accurate;
  # itunes/wikipedia are text-search based and can match the wrong edition (e.g. Aja)
  sources:
    - coverart
    - itunes
    - amazon
    - wikipedia
    - filesystem

embedart:
  auto: yes
  maxwidth: 1000
  ifempty: no
