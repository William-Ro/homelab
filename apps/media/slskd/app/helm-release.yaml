---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
  namespace: media
  labels:
    app.kubernetes.io/name: slskd
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/managed-by: flux
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: slskd

  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false

    controllers:
      slskd:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
        containers:
          app:
            image:
              repository: docker.io/slskd/slskd
              tag: 0.26.0
            env:
              SLSKD_HTTP_PORT: &port 5030
              SLSKD_NO_HTTPS: "true"
              SLSKD_REMOTE_CONFIGURATION: "true"
              SLSKD_DOWNLOADS_DIR: /data/soulseek
              SLSKD_SLSK_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: slskd-secret
                    key: soulseek_username
              SLSKD_SLSK_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: slskd-secret
                    key: soulseek_password
              SLSKD_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: slskd-secret
                    key: web_username
              SLSKD_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: slskd-secret
                    key: web_password
              SLSKD_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: slskd-secret
                    key: api_key
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /app
      data:
        type: nfs
        server: truenas.reli.cc
        path: /mnt/media/downloads
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
