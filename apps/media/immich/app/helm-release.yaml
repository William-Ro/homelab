---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: media
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/managed-by: flux
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: immich-chart

  values:
    server:
      controllers:
        main:
          annotations:
            reloader.stakater.com/auto: "true"
          containers:
            main:
              env:
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-app
                      key: uri
      persistence:
        library:
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 500Gi
          globalMounts:
            - path: /usr/src/app/upload

    immich:
      # Disable machine learning via immich's own config
      configuration:
        machineLearning:
          enabled: false

    machine-learning:
      enabled: false

    valkey:
      enabled: true
