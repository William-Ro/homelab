---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
  namespace: media
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: media

  path: ./apps/media/bazarr/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
