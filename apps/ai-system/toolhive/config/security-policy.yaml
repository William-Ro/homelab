---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: toolhive
  labels:
    app.kubernetes.io/name: toolhive
    app.kubernetes.io/component: securitypolicy
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: toolhive
  # Clients send `x-api-key: <key>`; each key in the Secret is one client. The header is stripped before the backend.
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: toolhive-api-keys
    extractFrom:
      - headers:
          - x-api-key
    sanitize: true
