---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-all.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
---
# The built-in view role only aggregates resourcesets and resourcesetinputproviders from fluxcd.controlplane.io;
# get_flux_instance also needs fluxinstances and fluxreports.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-mcp-flux-view
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["fluxinstances", "fluxreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-flux-view
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-mcp-flux-view
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai-system
---
# Write access is limited to patching Flux resources: reconcile sets the reconcile.fluxcd.io/requestedAt annotation
# (on the resource and, with with_source, its source) and suspend/resume patch spec.suspend. No create, update or delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-mcp-flux-reconcile
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      ["gitrepositories", "ocirepositories", "helmrepositories", "helmcharts", "buckets", "externalartifacts"]
    verbs: ["patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["patch"]
  - apiGroups: ["image.toolkit.fluxcd.io"]
    resources: ["imagerepositories", "imagepolicies", "imageupdateautomations"]
    verbs: ["patch"]
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["receivers"]
    verbs: ["patch"]
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["resourcesets", "resourcesetinputproviders", "fluxinstances"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-flux-reconcile
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-mcp-flux-reconcile
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai-system
---
# The built-in view role aggregates the Flux CRD view roles (read access).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai-system
