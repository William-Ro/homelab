---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-secret
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: externalsecret
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: grafana-mcp-secret
    creationPolicy: Owner

  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: Grafana MCP API Token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-api-keys
  labels:
    app.kubernetes.io/name: toolhive
    app.kubernetes.io/component: externalsecret
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: toolhive-api-keys
    creationPolicy: Owner

  # One entry per client; the Secret key is the Envoy client id. Revoke a client by removing its entry.
  data:
    - secretKey: laptop
      remoteRef:
        key: MCP Gateway Laptop Key
    - secretKey: desktop
      remoteRef:
        key: MCP Gateway Desktop Key
