---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: mcp-tools
  labels:
    app.kubernetes.io/name: toolhive
    app.kubernetes.io/component: mcpgroup
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  description: MCP servers aggregated behind the mcp-gateway VirtualMCPServer
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcpserver
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  image: grafana/mcp-grafana:2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
  transport: streamable-http
  mcpPort: 8000
  proxyPort: 8080
  groupRef:
    name: mcp-tools

  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability-system.svc.cluster.local:3000
    - name: GRAFANA_ORG_ID
      value: "1"

  secrets:
    - name: grafana-mcp-secret
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # The image entrypoint already sets --transport sse and --address 0.0.0.0:8000; a later --transport wins.
          args:
            - -t=streamable-http
            - --allowed-hosts=$(MY_POD_IP):8000,mcp-grafana:8000,mcp-grafana.ai-system:8000,mcp-grafana.ai-system.svc:8000,mcp-grafana.ai-system.svc.cluster.local:8000,localhost:8000,127.0.0.1:8000
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: mcpserver
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.62.1@sha256:0b4181bc9ada80eedf3e9df3355153abc9c3e6d8b913bddebe0b12908309bff6
  transport: streamable-http
  mcpPort: 8000
  proxyPort: 8080
  serviceAccount: flux-mcp
  groupRef:
    name: mcp-tools

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  podTemplateSpec:
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
            - --read-only
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
