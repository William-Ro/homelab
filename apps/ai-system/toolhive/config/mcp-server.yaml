---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: mcp-tools
  labels:
    app.kubernetes.io/name: toolhive
    app.kubernetes.io/component: mcpgroup
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  description: MCP servers aggregated behind the mcp-gateway VirtualMCPServer
---
# The operator already runs MCP pods as non-root (uid 1000) with a read-only root filesystem,
# no privilege escalation, all capabilities dropped and the RuntimeDefault seccomp profile.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: mcpserver
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
  transport: streamable-http
  mcpPort: 8000
  groupRef:
    name: mcp-tools

  # The image entrypoint defaults to SSE; a later -t wins. The ToolHive proxy calls the backend
  # as mcp-<name>:<mcpPort>, which is the only Host the server needs to accept.
  args:
    - -t=streamable-http
    - --allowed-hosts=mcp-grafana:8000

  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability-system.svc.cluster.local:3000
    - name: GRAFANA_ORG_ID
      value: "1"

  secrets:
    - name: grafana-mcp-secret
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

  # No Kubernetes API access needed by the Grafana server.
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: mcpserver
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.62.1@sha256:0b4181bc9ada80eedf3e9df3355153abc9c3e6d8b913bddebe0b12908309bff6
  transport: streamable-http
  mcpPort: 8000
  serviceAccount: flux-mcp
  groupRef:
    name: mcp-tools

  args:
    - serve
    - --transport=http
    - --port=8000

  # Without --read-only the server registers its write tools, but only reconcile, suspend and resume are exposed
  # by the gateway allowlist, and the service account can only patch Flux resources (see rbac.yaml).

  # The Flux runtime lives in flux-system, not in this MCPServer's namespace.
  env:
    - name: RUNTIME_NAMESPACE
      value: flux-system

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
