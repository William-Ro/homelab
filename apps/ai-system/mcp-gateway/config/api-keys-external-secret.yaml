---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-api-keys
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: api-keys
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore

  target:
    name: mcp-gateway-api-keys
    creationPolicy: Owner

  # One entry per client; the Secret key is the Envoy client id. Revoke a client by removing its entry.
  data:
    - secretKey: laptop
      remoteRef:
        key: MCP Gateway Laptop Key
    - secretKey: desktop
      remoteRef:
        key: MCP Gateway Desktop Key
