---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
  labels:
    app.kubernetes.io/name: flux-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: toolhive
    app.kubernetes.io/managed-by: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.62.1@sha256:0b4181bc9ada80eedf3e9df3355153abc9c3e6d8b913bddebe0b12908309bff6
  transport: streamable-http
  mcpPort: 8000
  proxyPort: 8080
  serviceAccount: flux-mcp
  groupRef:
    name: mcp-tools

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  podTemplateSpec:
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
            - --read-only
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
