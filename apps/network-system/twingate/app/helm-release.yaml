---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: twingate
  namespace: network-system
  labels:
    app.kubernetes.io/name: twingate
    app.kubernetes.io/part-of: twingate
    app.kubernetes.io/managed-by: flux
spec:
  interval: 1h
  chart:
    spec:
      chart: connector
      version: 0.1.35
      sourceRef:
        kind: HelmRepository
        name: twingate
        namespace: network-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: docker.io/twingate/connector
      tag: 1.89.0
      pullPolicy: IfNotPresent
    connector:
      logLevel: "info"
      network: "williamr2409"
      url: "twingate.com"
      existingSecret: twingate-secret
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
