---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: external-dns

  values:
    fullnameOverride: external-dns

    logLevel: info
    logFormat: text

    interval: 1m
    triggerLoopOnEvent: true

    policy: upsert-only
    registry: txt
    txtOwnerId: homelab

    sources:
      - ingress
      - service

    domainFilters:
      - home

    provider:
      name: pihole

    extraArgs:
      pihole-server: http://pihole-web.dns-system.svc.cluster.local
      pihole-api-version: "6"

    ingressClassFilters:
      - traefik

    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole-password
            key: password
