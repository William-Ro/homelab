---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: network-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: network-system

  path: ./apps/network-system/external-dns/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
