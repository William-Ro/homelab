---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: network-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: network-system

  path: ./apps/network-system/cert-manager/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    # wait for the CRDs to be installed
    - name: cert-manager

    # wait for the bitwarden-sdk-server secret store to be ready
    - name: bitwarden-sdk-server-config
      namespace: security-system
