---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unbound
  namespace: network-system
  labels:
    app.kubernetes.io/name: unbound
    app.kubernetes.io/part-of: unbound
    app.kubernetes.io/managed-by: flux
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: unbound

  values:
    fullnameOverride: unbound

    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    controllers:
      app:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/klutchell/unbound
              tag: 1.26.0
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 5
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                # NET_BIND_SERVICE: bind to port 53
                # SETUID/SETGID: unbound drops from root to the "unbound" user internally after binding
                add: ["NET_BIND_SERVICE", "SETUID", "SETGID"]

    service:
      app:
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP

    persistence:
      custom-conf:
        type: configMap
        name: unbound-custom-conf
        globalMounts:
          - path: /etc/unbound/custom.conf.d/hardening.conf
            subPath: hardening.conf
            readOnly: true
