---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: network-system
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: pihole
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: pihole

  values:
    replicas: 1

    podAnnotations:
      reloader.stakater.com/auto: "true"

    # Avoid node-02, which hosts NFS-heavy media apps (e.g. sabnzbd) whose
    # disk I/O contention has been observed to spike node load average high
    # enough to make pihole miss its DNS liveness probe and get restarted.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - node-02

    pihole:
      web:
        existingSecret: pihole-password
        service:
          type: LoadBalancer
          loadBalancerIP: 192.168.1.220
          externalTrafficPolicy: Local
          annotations:
            metallb.universe.tf/allow-shared-ip: pihole-svc

      ftl:
        dns:
          listeningMode: all
          upstreams:
            - unbound.network-system.svc.cluster.local

          service:
            type: LoadBalancer
            loadBalancerIP: 192.168.1.220
            externalTrafficPolicy: Local
            annotations:
              metallb.universe.tf/allow-shared-ip: pihole-svc

    persistence:
      etcPihole:
        enabled: true

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
