---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: default-client-policy
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway

  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 10.42.0.0/16

  http2:
    onInvalidMessage: TerminateStream

  http3: {}

  tcpKeepalive: {}

  tls:
    minVersion: "1.2"
    alpnProtocols: [h2, http/1.1]
