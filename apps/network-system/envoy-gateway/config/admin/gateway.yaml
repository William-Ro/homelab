---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-admin
  annotations:
    external-dns.alpha.kubernetes.io/target: &loadbalancerIP 192.168.1.201
spec:
  gatewayClassName: envoy-admin

  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: *loadbalancerIP

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All } #? allow app namespaces to attach HTTPRoutes
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces: { from: All } #? allow all namespaces for https
