---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: network-system
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/part-of: metallb
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: metallb

  values:
    crds:
      enabled: true
    networkpolicies:
      enabled: false

    controller:
      enabled: true
      logLevel: info  # all, debug, info, warn, error
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi

    speaker:
      enabled: true
      logLevel: info  # all, debug, info, warn, error

      tolerateMaster: false  # allow scheduling on master nodes
      ignoreExcludeLB: true  # Intentional: all nodes act as LB speakers regardless of the exclude-from-external-loadbalancer label

      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi
