---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: network-system
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/part-of: metallb
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: metallb

  values:
    crds:
      enabled: true
    networkpolicies:
      enabled: false

    controller:
      enabled: true
      logLevel: info
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi

    speaker:
      enabled: true
      logLevel: info

      tolerateMaster: false
      ignoreExcludeLB: true

      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi

    # frr-k8s subchart values (BGP backend DaemonSet — 5 containers per pod)
    frr-k8s:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 256Mi
      frr:
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi
      frrMetrics:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      frrStatus:
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 128Mi
      reloader:
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 32Mi
