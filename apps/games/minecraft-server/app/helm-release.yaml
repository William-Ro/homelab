---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-server
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: minecraft

  values:
    fullnameOverride: minecraft-server

    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.4.1@sha256:1544b0bd94b2734a5b12cb38e73751cc5dee4d7f6ab5b751afcb6ecc4b8f1460
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 4Gi

    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 3000
      runAsNonRoot: true
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]

    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 30
    startupProbe:
      enabled: true

    extraEnv:
      TZ: America/Costa_Rica

    persistence:
      dataDir:
        enabled: true

    serviceAnnotations:
      mc-router.itzg.me/externalServerName: server-mc.home.reli.cc

    minecraftServer:
      eula: true
      # renovate: datasource=custom.minecraft-release
      version: 26.1
      type: PAPER
      overrideServerProperties: true
      jvmXXOpts: "-XX:MaxRAMPercentage=75"
      difficulty: normal #? peaceful, easy, normal, hard
      spawnProtection: 0
      gameMode: survival #? creative, survival, adventure, spectator
      pvp: false
      onlineMode: true
      ops: "Rataconthiner666" #? comma separated list of operators
      motd: "Minecraft Server"
      worldSaveName: "world"
      viewDistance: 16
      rcon:
        enabled: true
        existingSecret: minecraft-server
        secretKey: RCON_PASSWORD
