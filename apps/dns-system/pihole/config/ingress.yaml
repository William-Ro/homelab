---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
spec:
  ingressClassName: traefik
  rules:
    - host: pihole.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole-web
                port:
                  number: 80
