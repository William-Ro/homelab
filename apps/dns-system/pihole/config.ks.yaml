---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole-config
  namespace: dns-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: dns-system

  path: ./apps/dns-system/pihole/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: pihole
