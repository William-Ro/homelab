---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: dns
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: pihole
    app.kubernetes.io/managed-by: flux
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: pihole

  values:
    replicas: 1

    pihole:
      web:
        password: "changeme"
        service:
          type: LoadBalancer
          loadBalancerIP: 192.168.1.220
          externalTrafficPolicy: Local
          annotations:
            metallb.universe.tf/allow-shared-ip: pihole-svc

      ftl:
        dns:
          listeningMode: all
          upstreams:
            - 192.168.1.1

          service:
            type: LoadBalancer
            loadBalancerIP: 192.168.1.220
            externalTrafficPolicy: Local
            annotations:
              metallb.universe.tf/allow-shared-ip: pihole-svc

    persistence:
      etcPihole:
        enabled: true
