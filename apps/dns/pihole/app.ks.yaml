---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole
  namespace: dns
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: dns

  path: ./apps/dns/pihole/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: pihole-config
