---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance-config
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: flux-system

  path: ./apps/flux-system/flux-instance/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: flux-instance
    - name: grafana
      namespace: observability-system
