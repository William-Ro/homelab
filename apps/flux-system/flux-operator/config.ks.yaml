---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator-config
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  targetNamespace: flux-system

  path: ./apps/flux-system/flux-operator/config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  dependsOn:
    - name: flux-operator
    - name: envoy-gateway
      namespace: network-system
