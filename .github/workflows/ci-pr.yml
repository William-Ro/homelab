# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "renovate/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          pip install yamllint --quiet
          yamllint --strict -c .yamllint.yaml apps/ bootstrap/

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          docker run --rm -v "$PWD:/github/workspace" -w /github/workspace -e HOME=/tmp \
            ghcr.io/home-operations/flate:0.7.3 test --path .github/flux-local

  diff:
    name: Diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show diff in run summary
        run: |
          {
            docker run --rm -v "$PWD:/github/workspace" -w /github/workspace -e HOME=/tmp \
              ghcr.io/home-operations/flate:0.7.3 diff --base origin/main \
              --path .github/flux-local --output github
          } >> "$GITHUB_STEP_SUMMARY"
