# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          pip install yamllint --quiet
          yamllint --strict -c .yamllint.yaml apps/ bootstrap/

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            test
            --all-namespaces
            --path /github/workspace/.github/flux-local
            --skip-secrets
            --kustomize-build-flags=--load-restrictor=LoadRestrictionsNone
            -v

  diff:
    name: Diff ${{ matrix.resources }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        resources: [helmrelease, kustomization]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default
          persist-credentials: false

      - uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/.github/flux-local
            --path-orig /github/workspace/default/.github/flux-local
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --skip-secrets
            --kustomize-build-flags=--load-restrictor=LoadRestrictionsNone
            --output-file diff.patch

      - name: Show diff in run summary
        run: |
          {
            echo '```diff'
            cat diff.patch
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
